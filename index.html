<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Documento confidencial</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

        <style>
            :root {
                --bg: #07080b;
                --surface: #0f1117;
                --border: rgba(255, 255, 255, 0.10);
                --text: #ffffff;
                --muted: #8b93a7;
                --accent: #6e8bff;
                --accent-ink: #07080b;
            }

            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; }

            .staticrypt-content {
                height: 100%;
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                background-image:
                    radial-gradient(ellipse 70% 55% at 50% -10%, rgba(110, 139, 255, 0.10), transparent 70%),
                    linear-gradient(rgba(110, 139, 255, 0.035) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(110, 139, 255, 0.035) 1px, transparent 1px);
                background-size: 100% 100%, 46px 46px, 46px 46px;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 400px;
                padding: 24px;
                margin: auto;
                box-sizing: border-box;
                min-height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                width: 100%;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 40px 34px;
                text-align: center;
                box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7);
                box-sizing: border-box;
            }

            .staticrypt-lock {
                width: 44px;
                height: 44px;
                border-radius: 12px;
                margin: 0 auto 22px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #6e8bff, #a78bfa);
            }
            .staticrypt-lock svg { width: 22px; height: 22px; display: block; }

            .staticrypt-instructions { margin-bottom: 26px; }

            .staticrypt-title {
                font-family: "Space Grotesk", "Hanken Grotesk", sans-serif;
                font-size: 1.32em;
                font-weight: 700;
                letter-spacing: -0.01em;
                color: var(--text);
                margin: 0 0 8px;
            }
            .staticrypt-instructions p:not(.staticrypt-title) {
                color: var(--muted);
                font-size: 0.95em;
                line-height: 1.5;
                margin: 0;
            }

            .staticrypt-password-container {
                position: relative;
                width: 100%;
                margin: 0 0 14px;
                box-sizing: border-box;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: #07080b;
                border: 1px solid var(--border);
                border-radius: 10px;
                box-sizing: border-box;
                color: var(--text);
                font-size: 15px;
                font-family: inherit;
                outline: 0;
                padding: 15px 46px 15px 16px;
                width: 100%;
                transition: border-color 0.15s ease, box-shadow 0.15s ease;
            }
            .staticrypt-form input[type="password"]::placeholder,
            .staticrypt-form input[type="text"]::placeholder { color: #5b6376; }
            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(110, 139, 255, 0.22);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                width: 20px;
                opacity: 0.5;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                filter: invert(1);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                font-family: "Space Grotesk", "Hanken Grotesk", sans-serif;
                text-transform: none;
                outline: 0;
                background: var(--accent);
                width: 100%;
                border: 0;
                border-radius: 10px;
                padding: 15px;
                color: var(--accent-ink);
                font-size: 15px;
                font-weight: 700;
                cursor: pointer;
                transition: filter 0.15s ease, transform 0.05s ease;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover { filter: brightness(1.08); }
            .staticrypt-form .staticrypt-decrypt-button:active { transform: translateY(1px); }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 18px;
                color: var(--muted);
                font-size: 0.9em;
            }
            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.35);
                margin-right: 0.8em;
                accent-color: var(--accent);
            }

            .staticrypt-brand {
                margin-top: 26px;
                color: #4b5468;
                font-size: 0.78em;
                letter-spacing: 0.02em;
            }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg);
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 0.25em solid rgba(255, 255, 255, 0.18);
                border-right-color: var(--accent);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] { font-size: 16px; }
            }
        </style>
    </head>

                        <input type="submit" class="staticrypt-decrypt-button" value="Ver documento" />
                    </form>

                    <div class="staticrypt-brand">Documento confidencial · acceso restringido</div>

            </div>
